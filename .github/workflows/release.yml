name: Release

# Pushing a tag such as v0.2.0-alpha builds what players download and
# publishes it as a GitHub release:
#   TrailMate-<version>.zip   the addon, to copy into Interface/AddOns
#   trailmate-bridge.exe      the companion bridge for Windows (optional)
# and uploads the zip to CurseForge (the project id is in the .toc on main,
# the API token in the CF_API_TOKEN secret; the bridge is not uploaded there:
# CurseForge takes no programs).
# An older tag (made before this file existed) is released by running the
# workflow by hand with that tag: the code comes from the tag, the notes
# from CHANGELOG.md on main. A release that already exists is kept, so the
# same run can send an older version to CurseForge.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, for example v0.1.0-alpha"
        required: true
      curseforge:
        description: "Also upload it to CurseForge"
        type: boolean
        default: false

permissions:
  contents: read

env:
  ADDON: TrailMate
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    name: Build the zip and the bridge, and publish the release
    runs-on: ubuntu-24.04
    permissions:
      contents: write # to create the release
    steps:
      - name: Checkout main (for the notes)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
          fetch-depth: 0 # the whole history and the tags

      - name: Check out the tag's code
        run: |
          git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null
          # Only tags on main are released.
          git merge-base --is-ancestor "refs/tags/$TAG" origin/main
          git worktree add src "refs/tags/$TAG"

      - name: Check that the tag matches the version in the .toc
        run: |
          version=$(sed -n 's/^## Version: *//p' "src/$ADDON/$ADDON.toc" | tr -d '\r')
          if [ "v$version" != "$TAG" ]; then
            echo "The tag is $TAG but $ADDON.toc says $version." >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build the zip
        run: |
          mkdir -p dist
          # The addon folder as it is in the repository, with the license
          # and the README that must travel with the code.
          cp -r "src/$ADDON" "dist/$ADDON"
          cp src/LICENSE src/README.md "dist/$ADDON/"
          (cd dist && zip -qr "$ADDON-$VERSION.zip" "$ADDON")
          unzip -l "dist/$ADDON-$VERSION.zip" | tail -3

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: false

      - name: Build the bridge for Windows
        working-directory: src/bridge
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
          GOTOOLCHAIN: local
        run: |
          go build -trimpath -ldflags "-s -w" -o ../../dist/trailmate-bridge.exe ./cmd/trailmate-bridge
          ls -l ../../dist/trailmate-bridge.exe

      - name: Take this version's notes from the changelog
        run: |
          # The section whose heading is exactly this version: "## 0.2.0-alpha"
          # or "## 0.2.0-alpha (date)", never "## 0.2.0-alpha.1".
          awk -v version="$VERSION" '
            BEGIN { gsub(/\./, "\\.", version) }
            $0 ~ ("^## " version "( |$)") { found = 1; next }
            /^## / { found = 0 }
            found
          ' CHANGELOG.md > notes.md
          test -s notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          # A normal release even for an alpha (its name says so): GitHub
          # shows only a normal release as the latest on the repository's
          # front page. A new tag becomes the latest; an older one released
          # by hand does not take its place.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "The release $TAG exists already: kept as it is."
            exit 0
          fi
          latest="--latest"
          if [ "$EVENT" = "workflow_dispatch" ]; then latest="--latest=false"; fi
          gh release create "$TAG" "dist/$ADDON-$VERSION.zip" dist/trailmate-bridge.exe \
            --title "$ADDON $VERSION" --notes-file notes.md --verify-tag "$latest"

      - name: Upload the zip to CurseForge
        if: github.event_name == 'push' || inputs.curseforge
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          # WoW Forever's game version on CurseForge.
          CF_GAME_VERSION: "1.60.1"
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo "No CF_API_TOKEN secret: not uploading to CurseForge."
            exit 0
          fi
          project=$(sed -n 's/^## X-Curse-Project-ID: *//p' "$ADDON/$ADDON.toc" | tr -d '\r')
          if [ -z "$project" ]; then
            echo "No X-Curse-Project-ID in $ADDON.toc on main: not uploading to CurseForge."
            exit 0
          fi
          api="https://wow.curseforge.com/api"
          ids=$(curl -fsS -H "X-Api-Token: $CF_API_TOKEN" "$api/game/versions" \
            | jq -c --arg v "$CF_GAME_VERSION" '[.[] | select(.name == $v) | .id]')
          echo "CurseForge game versions named $CF_GAME_VERSION: $ids"
          if [ "$(echo "$ids" | jq length)" != 1 ]; then
            echo "Expected exactly one game version $CF_GAME_VERSION." >&2
            exit 1
          fi
          case "$VERSION" in
            *alpha*) type=alpha ;;
            *beta*) type=beta ;;
            *) type=release ;;
          esac
          jq -n --rawfile log notes.md --arg name "$ADDON $VERSION" --arg type "$type" --argjson versions "$ids" \
            '{changelog: $log, changelogType: "markdown", displayName: $name, gameVersions: $versions, releaseType: $type}' \
            > cf-metadata.json
          curl -fsS -H "X-Api-Token: $CF_API_TOKEN" \
            -F "metadata=<cf-metadata.json" -F "file=@dist/$ADDON-$VERSION.zip" \
            "$api/projects/$project/upload-file"
          echo
          echo "Uploaded $ADDON $VERSION to CurseForge project $project as $type."
